<div
  id="cookie-consent"
  class="cookie-consent"
  role="dialog"
  aria-label="Preferencias de cookies"
  aria-describedby="cookie-consent-desc"
  hidden>
  <div class="cookie-consent__inner">
    <div id="cookie-consent-desc" class="cookie-consent__text">
      <p class="cookie-consent__line">Usamos cookies para mejorar el sitio y medir su uso.</p>
      <p class="cookie-consent__line">
        Si rechazás, solo registramos estadísticas anónimas sin cookies.
        <a href="/privacidad/">Política de privacidad</a>.
      </p>
    </div>
    <div class="cookie-consent__actions">
      <button type="button" class="cookie-consent__btn cookie-consent__btn--decline" data-cookie-decline>
        Rechazar
      </button>
      <button type="button" class="cookie-consent__btn cookie-consent__btn--accept" data-cookie-accept>
        Aceptar cookies
      </button>
    </div>
  </div>
</div>
